<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%">
  <rect width="700" height="700" fill="#121212"/>
  <text x="350" y="45" fill="#F59E0B" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">HEIRLOOM SEED PRESERVATION VAULT</text>
  <text x="350" y="70" fill="#FDE68A" font-size="14" font-family="sans-serif" text-anchor="middle">Open-Pollinated Preservation for Multi-Generational Security</text>

  <!-- Mason Jar -->
  <rect x="230" y="140" width="240" height="380" rx="20" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <rect x="270" y="110" width="160" height="30" rx="4" fill="#64748B" stroke="#CBD5E1" stroke-width="2"/>
  <text x="350" y="130" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Airtight Clamp Ring</text>

  <!-- Desiccant / Charcoal at top -->
  <rect x="260" y="170" width="180" height="40" rx="6" fill="#18181B" stroke="#52525B" stroke-width="2"/>
  <text x="350" y="195" fill="#A1A1AA" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">Charcoal / Silica Moisture Sorb</text>

  <!-- Seed Mass -->
  <polygon points="245,260 455,260 450,500 250,500" fill="#D97706" opacity="0.85"/>
  <text x="350" y="360" fill="#FFFFFF" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">HEIRLOOM NON-GMO SEEDS</text>
  <text x="350" y="390" fill="#FEF3C7" font-size="13" font-family="sans-serif" text-anchor="middle">Moisture content dried to &lt; 8%</text>
  <text x="350" y="415" fill="#FEF3C7" font-size="12" font-family="sans-serif" text-anchor="middle">(Snap test: seed cracks, does not bend)</text>

  <!-- Storage conditions -->
  <rect x="60" y="560" width="580" height="100" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="350" y="590" fill="#38BDF8" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">VAULT PRESERVATION DIRECTIVES</text>
  <text x="350" y="618" fill="#E2E8F0" font-size="13" font-family="sans-serif" text-anchor="middle">Never freeze damp seeds. Store in total subterranean darkness at &lt; 10°C (50°F).</text>
  <text x="350" y="640" fill="#4ADE80" font-size="12" font-family="sans-serif" text-anchor="middle">Rotate test batches every 3-5 years to verify germination rates above 80%.</text>
</svg>