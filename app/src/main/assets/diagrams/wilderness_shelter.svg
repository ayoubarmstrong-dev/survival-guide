<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%">
  <rect width="700" height="700" fill="#121212"/>
  <text x="350" y="45" fill="#4ADE80" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">THERMAL DEBRIS HUT ARCHITECTURE</text>
  <text x="350" y="70" fill="#86EFAC" font-size="14" font-family="sans-serif" text-anchor="middle">Wilderness Hypothermia Prevention &amp; Construction</text>

  <!-- Ridgepole Structure -->
  <line x1="140" y1="460" x2="520" y2="220" stroke="#78350F" stroke-width="12" stroke-linecap="round"/>
  <text x="310" y="300" fill="#FDE68A" font-size="14" font-weight="bold" font-family="sans-serif" transform="rotate(-30, 310, 300)">Main Ridgepole (Solid Timber)</text>

  <!-- Support Y-Sticks -->
  <line x1="520" y1="220" x2="570" y2="460" stroke="#B45309" stroke-width="8"/>
  <line x1="520" y1="220" x2="490" y2="460" stroke="#92400E" stroke-width="8"/>
  <text x="560" y="350" fill="#FEF3C7" font-size="12" font-family="sans-serif">Bipod Support</text>

  <!-- Ground Line -->
  <line x1="80" y1="460" x2="620" y2="460" stroke="#3F3F46" stroke-width="4"/>

  <!-- Thick Bedding (30cm) -->
  <rect x="180" y="415" width="300" height="45" fill="#D97706" opacity="0.8" rx="6"/>
  <text x="330" y="442" fill="#FFFFFF" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Insulating Bedding (Leaves / Pine: 30 cm)</text>

  <!-- Outer Debris Mound -->
  <path d="M 120 460 Q 340 160 540 460 Z" fill="#15803D" opacity="0.3" stroke="#22C55E" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="340" y="220" fill="#86EFAC" font-size="13" font-weight="bold" font-family="sans-serif" text-anchor="middle">Outer Debris Layer: 60 cm Thick</text>
  <text x="340" y="240" fill="#DCFCE7" font-size="11" font-family="sans-serif" text-anchor="middle">(Traps ambient body heat like a sleeping bag)</text>

  <!-- Construction Rules -->
  <rect x="60" y="520" width="580" height="130" rx="8" fill="#1E1E1E" stroke="#333"/>
  <text x="80" y="550" fill="#FACC15" font-size="14" font-weight="bold" font-family="sans-serif">CRITICAL CONSTRUCTION RULES:</text>
  <text x="80" y="580" fill="#E2E8F0" font-size="13" font-family="sans-serif">1. Ground insulation is mandatory; bare soil drains heat 20x faster than air.</text>
  <text x="80" y="605" fill="#E2E8F0" font-size="13" font-family="sans-serif">2. Keep internal space small; excess room requires body energy to warm.</text>
  <text x="80" y="630" fill="#E2E8F0" font-size="13" font-family="sans-serif">3. Block entrance tightly with a backpack or packed debris bundle at night.</text>
</svg>