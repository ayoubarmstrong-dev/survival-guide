<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 650" width="100%" height="100%">
  <rect width="650" height="650" fill="#121212"/>
  <text x="325" y="40" fill="#FFD600" font-size="20" font-family="sans-serif" font-weight="bold" text-anchor="middle">عوامل الوقاية من الغبار النووي (Nuclear Fallout Shielding)</text>

  <!-- Ground surface -->
  <line x1="50" y1="180" x2="600" y2="180" stroke="#795548" stroke-width="6"/>
  <text x="590" y="170" fill="#A1887F" font-size="12" text-anchor="end">سطح الأرض (Fallout Layer)</text>

  <!-- Outside exposure -->
  <circle cx="120" cy="120" r="30" fill="#FFD600" opacity="0.3"/>
  <text x="120" y="125" fill="#FFD600" font-size="12" font-weight="bold" text-anchor="middle">إشعاع 100%</text>

  <!-- Wood House -->
  <rect x="70" y="240" width="130" height="120" fill="#3E2723" stroke="#8D6E63" stroke-width="2"/>
  <text x="135" y="290" fill="#FFF" font-size="13" font-weight="bold" text-anchor="middle">منزل خشبي</text>
  <text x="135" y="320" fill="#FFAB91" font-size="12" text-anchor="middle">يقلل الإشعاع بنسبة 50%</text>

  <!-- Brick / Concrete House -->
  <rect x="250" y="240" width="150" height="150" fill="#263238" stroke="#78909C" stroke-width="2"/>
  <text x="325" y="295" fill="#FFF" font-size="13" font-weight="bold" text-anchor="middle">مبنى خرساني سميك</text>
  <text x="325" y="325" fill="#80CBC4" font-size="12" text-anchor="middle">يقلل الإشعاع بنسبة 90%</text>

  <!-- Deep Underground Basement -->
  <rect x="440" y="350" width="160" height="180" fill="#0D1B2A" stroke="#00E676" stroke-width="3"/>
  <text x="520" y="420" fill="#00E676" font-size="14" font-weight="bold" text-anchor="middle">قبو خرساني تحت الأرض</text>
  <text x="520" y="450" fill="#E0F2F1" font-size="12" text-anchor="middle">يقلل الإشعاع بنسبة 99%+</text>
  <text x="520" y="480" fill="#FFF" font-size="11" text-anchor="middle">(حماية مثالية لأول 48-72 ساعة)</text>
</svg>