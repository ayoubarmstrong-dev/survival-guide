<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="100%" height="100%">
  <rect width="700" height="700" fill="#121212"/>
  <text x="350" y="45" fill="#F87171" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="middle">STRUCTURAL VOID / SURVIVAL TRIANGLE</text>
  <text x="350" y="70" fill="#FECACA" font-size="14" font-family="sans-serif" text-anchor="middle">Earthquake &amp; Artillery Blast Structural Refuge</text>

  <!-- Collapsed Heavy Concrete Ceiling Slab -->
  <polygon points="120,200 620,380 610,430 110,250" fill="#334155" stroke="#94A3B8" stroke-width="3"/>
  <text x="360" y="270" fill="#F8FAFC" font-size="15" font-weight="bold" font-family="sans-serif" transform="rotate(18, 360, 270)">Collapsed Concrete Slab</text>

  <!-- Heavy Load-Bearing Furniture (Solid Desk / Sofa) -->
  <rect x="420" y="430" width="190" height="150" rx="4" fill="#78350F" stroke="#B45309" stroke-width="3"/>
  <text x="515" y="500" fill="#FEF3C7" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">Dense Heavy Object</text>
  <text x="515" y="525" fill="#FDE68A" font-size="12" font-family="sans-serif" text-anchor="middle">(Solid Desk / Sofa / Bed)</text>

  <!-- The Triangle of Life Void (Protected Area) -->
  <polygon points="420,430 420,580 180,580" fill="#16A34A" opacity="0.35" stroke="#22C55E" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="350" y="530" fill="#4ADE80" font-size="16" font-weight="bold" font-family="sans-serif" text-anchor="middle">SURVIVAL VOID</text>
  <text x="350" y="555" fill="#DCFCE7" font-size="12" font-family="sans-serif" text-anchor="middle">(Triangle of Life)</text>

  <!-- Person Position -->
  <ellipse cx="320" cy="550" rx="40" ry="15" fill="#38BDF8"/>
  <text x="320" y="554" fill="#082F49" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Fetal Posture</text>

  <!-- Danger Zone under furniture -->
  <text x="515" y="565" fill="#EF4444" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">DO NOT GET UNDER</text>

  <!-- Concrete Floor -->
  <rect x="80" y="580" width="560" height="20" fill="#1E293B" stroke="#475569" stroke-width="2"/>
  <text x="350" y="630" fill="#E2E8F0" font-size="13" font-family="sans-serif" text-anchor="middle">Lie in the fetal position alongside dense objects, never beneath them.</text>
  <text x="350" y="655" fill="#F87171" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">If trapped: Tap 3 times rhythmically every 60 seconds with metal or stone.</text>
</svg>